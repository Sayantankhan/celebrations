<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Coming Soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #090b12;
      color: #f5f4f0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      z-index: -2;
      width: min(68vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(104, 119, 255, .19), rgba(91, 75, 180, .08) 38%, transparent 70%);
      filter: blur(18px);
      animation: breathe 7s ease-in-out infinite;
    }
    .orb {
      position: absolute;
      z-index: -1;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aab4ff;
      opacity: .48;
      box-shadow: 0 0 20px 4px rgba(137, 151, 255, .3);
      animation: drift 9s ease-in-out infinite alternate;
    }
    .orb.one { top: 23%; left: 19%; }
    .orb.two { top: 69%; right: 21%; width: 5px; height: 5px; animation-delay: -3s; }
    .orb.three { bottom: 20%; left: 31%; width: 4px; height: 4px; animation-delay: -5s; }
    .rocket {
      position: absolute;
      z-index: -1;
      bottom: -70px;
      left: var(--x);
      width: 30px;
      height: 46px;
      opacity: 0;
      color: #c4caff;
      filter: drop-shadow(0 0 8px rgba(147, 160, 255, .55));
      animation: launch var(--duration) linear var(--delay) infinite;
      pointer-events: none;
    }
    .rocket svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .rocket .flame { transform-origin: 15px 35px; animation: flicker .16s ease-in-out infinite alternate; }
    .rocket.two { width: 22px; height: 34px; color: #a9b6df; }
    .rocket.three { width: 25px; height: 39px; color: #d2b9ff; }
    .content { max-width: 720px; animation: arrive 1.1s cubic-bezier(.2,.75,.25,1) both; }
    .eyebrow {
      margin: 0 0 22px;
      color: #9ba5d8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .34em;
      text-transform: uppercase;
      animation: fade 1.2s .25s both;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 88px);
      line-height: .98;
      font-weight: 650;
      letter-spacing: -.065em;
      background: linear-gradient(110deg, #fff 15%, #c7ccff 48%, #8d98ed 72%, #fff 92%);
      background-size: 220% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shimmer 7s linear infinite;
    }
    .rule {
      width: 54px;
      height: 1px;
      margin: 30px auto 22px;
      background: linear-gradient(90deg, transparent, #9da8ff, transparent);
      animation: expand 1.3s .45s both;
    }
    .sub {
      margin: 0;
      color: #9699a8;
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 400;
      letter-spacing: .025em;
      animation: fade 1.2s .6s both;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes breathe { 0%,100% { transform: scale(.88); opacity: .65; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes drift { from { transform: translate3d(0, -12px, 0); } to { transform: translate3d(16px, 18px, 0); } }
    @keyframes shimmer { to { background-position: 220% center; } }
    @keyframes expand { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes launch {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      8% { opacity: .72; }
      82% { opacity: .62; }
      100% { transform: translate3d(75px, -115vh, 0) rotate(7deg); opacity: 0; }
    }
    @keyframes flicker { from { transform: scaleY(.78); opacity: .7; } to { transform: scaleY(1.18); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .rocket { display: none; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="glow" aria-hidden="true"></div>
    <span class="orb one" aria-hidden="true"></span>
    <span class="orb two" aria-hidden="true"></span>
    <span class="orb three" aria-hidden="true"></span>

    <div class="rocket one" style="--x: 13%; --duration: 13s; --delay: -8s" aria-hidden="true">
      <svg viewBox="0 0 30 46" fill="none">
        <path d="M15 2C9 8 7 17 8 27L15 34L22 27C23 17 21 8 15 2Z" fill="currentColor" fill-opacity=".92"/>
        <path d="M15 2C15 2 12 12 12 21C12 26 13 30 15 34C17 30 18 26 18 21C18 12 15 2 15 2Z" fill="#F4F3FF" fill-opacity=".75"/>
        <circle cx="15" cy="17" r="3.1" fill="#626FAE"/>
        <path d="M8 22L3 30L9 28M22 22L27 30L21 28" fill="currentColor"/>
        <path class="flame" d="M11 32L15 44L19 32L15 35L11 32Z" fill="#FFB66D"/>
      </svg>
    </div>
    <div class="rocket two" style="--x: 77%; --duration: 16s; --delay: -12s" aria-hidden="true">
      <svg viewBox="0 0 30 46" fill="none">
        <path d="M15 2C9 8 7 17 8 27L15 34L22 27C23 17 21 8 15 2Z" fill="currentColor"/>
        <circle cx="15" cy="17" r="3.1" fill="#626FAE"/>
        <path d="M8 22L3 30L9 28M22 22L27 30L21 28" fill="currentColor"/>
        <path class="flame" d="M11 32L15 44L19 32L15 35L11 32Z" fill="#FFB66D"/>
      </svg>
    </div>
    <div class="rocket three" style="--x: 47%; --duration: 19s; --delay: -4s" aria-hidden="true">
      <svg viewBox="0 0 30 46" fill="none">
        <path d="M15 2C9 8 7 17 8 27L15 34L22 27C23 17 21 8 15 2Z" fill="currentColor"/>
        <circle cx="15" cy="17" r="3.1" fill="#626FAE"/>
        <path d="M8 22L3 30L9 28M22 22L27 30L21 28" fill="currentColor"/>
        <path class="flame" d="M11 32L15 44L19 32L15 35L11 32Z" fill="#FFB66D"/>
      </svg>
    </div>

    <section class="content" aria-label="Coming soon">
      <p class="eyebrow">A little something is on its way</p>
      <h1>COMING SOON</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="sub">Something good is taking shape. Stay tuned.</p>
    </section>
  </main>
</body>
</html>
