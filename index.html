<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030611">
  <meta name="description" content="Something good is taking shape. Stay tuned.">
  <title>Coming Soon</title>
  <style>
    :root { color-scheme: dark; --ink: #f5f6ff; --muted: #a4abc4; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      background: #030611;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(20, 39, 91, .32), transparent 42%),
        radial-gradient(ellipse at 50% 110%, rgba(24, 39, 84, .28), transparent 55%),
        #030611;
    }
    #space {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: pan-y;
      cursor: grab;
      outline: none;
    }
    #space:active { cursor: grabbing; }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(2, 4, 12, .25) 72%, rgba(2, 4, 12, .72) 120%);
    }
    .content {
      position: absolute;
      z-index: 2;
      left: 20px;
      right: 20px;
      bottom: max(8vh, 54px);
      text-align: center;
      pointer-events: none;
      animation: arrive 1.2s cubic-bezier(.2,.75,.25,1) both;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .65);
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #b7c4ee;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .38em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 78px);
      line-height: .98;
      font-weight: 650;
      letter-spacing: -.065em;
      background: linear-gradient(110deg, #fff 12%, #d4dcff 46%, #94a9f4 72%, #fff 94%);
      background-size: 220% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shimmer 8s linear infinite;
    }
    .rule {
      width: 52px;
      height: 1px;
      margin: 25px auto 18px;
      background: linear-gradient(90deg, transparent, #aabaff, transparent);
    }
    .sub {
      margin: 0;
      color: #b2b8ce;
      font-size: clamp(13px, 2vw, 15px);
      letter-spacing: .025em;
    }
    .hint {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: max(24px, env(safe-area-inset-bottom));
      margin: 0;
      color: rgba(194, 204, 235, .58);
      font-size: 10px;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
      animation: fade 1.5s .8s both;
    }
    .load-error {
      position: absolute;
      z-index: 1;
      top: 16px;
      left: 16px;
      right: 16px;
      color: rgba(210, 218, 244, .55);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shimmer { to { background-position: 220% center; } }
    @media (max-width: 600px) {
      .content { bottom: max(10vh, 76px); }
      .eyebrow { font-size: 9px; letter-spacing: .28em; margin-bottom: 14px; }
      .rule { margin: 19px auto 14px; }
      .hint { font-size: 9px; letter-spacing: .12em; }
    }
    @media (max-height: 620px) and (orientation: landscape) {
      .content { bottom: 28px; }
      .eyebrow { margin-bottom: 10px; }
      .rule { margin: 12px auto; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <canvas id="space" aria-label="Interactive three-dimensional Earth. Drag to rotate the globe."></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <section class="content" aria-label="Coming soon">
      <p class="eyebrow">A little something is on its way</p>
      <h1>COMING SOON</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="sub">Something good is taking shape. Stay tuned.</p>
    </section>
    <p class="hint">Drag to explore · The world is turning</p>
    <p class="load-error" id="load-error" hidden>For the best experience, enable WebGL in your browser.</p>
  </main>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const canvas = document.querySelector('#space');
    const errorMessage = document.querySelector('#load-error');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    try {
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: window.devicePixelRatio < 2,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
      camera.position.set(0, 0, 6.8);

      const earthRoot = new THREE.Group();
      scene.add(earthRoot);

      const ambient = new THREE.AmbientLight(0x9eafd9, 1.15);
      scene.add(ambient);
      const sun = new THREE.DirectionalLight(0xfff1dc, 2.8);
      sun.position.set(-4, 2.5, 5);
      scene.add(sun);
      const rimLight = new THREE.DirectionalLight(0x477bff, 1.35);
      rimLight.position.set(4, -1.5, -3);
      scene.add(rimLight);

      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin('anonymous');
      const loadTexture = (url, color = false) => new Promise((resolve, reject) => {
        loader.load(url, texture => {
          if (color) texture.colorSpace = THREE.SRGBColorSpace;
          resolve(texture);
        }, undefined, reject);
      });

      const earthUrl = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
      const cloudUrl = 'https://threejs.org/examples/textures/planets/earth_clouds_1024.png';

      const earthGeometry = new THREE.SphereGeometry(1.72, 96, 96);
      const earthMaterial = new THREE.MeshPhongMaterial({
        shininess: 12,
        specular: new THREE.Color(0x34466e)
      });
      const earth = new THREE.Mesh(earthGeometry, earthMaterial);
      earthRoot.add(earth);

      const cloudMaterial = new THREE.MeshPhongMaterial({
        transparent: true,
        opacity: 0.34,
        depthWrite: false,
        blending: THREE.NormalBlending,
        color: 0xc9d8ff
      });
      const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.744, 80, 80), cloudMaterial);
      earthRoot.add(clouds);

      // A restrained Fresnel rim: thin at the limb, almost invisible over the face.
      const atmosphereMaterial = new THREE.ShaderMaterial({
        uniforms: {
          glowColor: { value: new THREE.Color(0x5b91c9) },
          sunDirection: { value: new THREE.Vector3(-0.6, 0.35, 0.72).normalize() }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 glowColor;
          uniform vec3 sunDirection;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          void main() {
            vec3 N = normalize(vNormal);
            vec3 V = normalize(vViewPosition);
            float rim = pow(1.0 - max(dot(N, V), 0.0), 4.2);
            float daylight = 0.22 + 0.78 * max(dot(N, normalize(sunDirection)), 0.0);
            float alpha = rim * daylight * 0.20;
            gl_FragColor = vec4(glowColor, alpha);
          }
        `,
        side: THREE.FrontSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });
      const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(1.755, 96, 96), atmosphereMaterial);
      earthRoot.add(atmosphere);

      const starCount = window.innerWidth < 600 ? 900 : 1700;
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const radius = 12 + Math.random() * 34;
        const theta = Math.random() * Math.PI * 2;
        const z = (Math.random() * 2) - 1;
        const ring = Math.sqrt(1 - z * z);
        starPositions[i * 3] = radius * ring * Math.cos(theta);
        starPositions[i * 3 + 1] = radius * z;
        starPositions[i * 3 + 2] = radius * ring * Math.sin(theta);
      }
      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({
        color: 0xc8d5ff, size: 0.045, transparent: true, opacity: 0.78, sizeAttenuation: true
      }));
      scene.add(stars);

      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(0.075, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0x9ba7c4, roughness: 1, metalness: 0 })
      );
      moon.position.set(2.65, 1.15, -1.8);
      scene.add(moon);

      const [earthTexture, cloudTexture] = await Promise.all([
        loadTexture(earthUrl, true),
        loadTexture(cloudUrl, true).catch(() => null)
      ]);
      earthMaterial.map = earthTexture;
      earthMaterial.needsUpdate = true;
      if (cloudTexture) {
        cloudMaterial.map = cloudTexture;
        cloudMaterial.needsUpdate = true;
      }

      let width = 0, height = 0;
      const resize = () => {
        width = window.innerWidth;
        height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.position.z = width < 600 ? 7.5 : width < 900 ? 7.1 : 6.8;
        camera.fov = width < 600 ? 39 : 34;
        camera.updateProjectionMatrix();
        const globeScale = width < 420 ? 0.82 : width < 600 ? 0.9 : width < 900 ? 1 : 1.08;
        earthRoot.scale.setScalar(globeScale);
        earthRoot.position.y = width < 600 ? 0.62 : 0.48;
      };
      resize();
      window.addEventListener('resize', resize, { passive: true });

      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      let velocityX = 0;
      let velocityY = 0;

      canvas.addEventListener('pointerdown', event => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        velocityX = velocityY = 0;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (!dragging) return;
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        earthRoot.rotation.y += dx * 0.006;
        earthRoot.rotation.x = THREE.MathUtils.clamp(earthRoot.rotation.x + dy * 0.004, -0.65, 0.65);
        velocityX = dx * 0.0008;
        velocityY = dy * 0.0005;
        lastX = event.clientX;
        lastY = event.clientY;
      });
      const release = () => { dragging = false; };
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);
      canvas.addEventListener('lostpointercapture', release);

      const clock = new THREE.Clock();
      let animationFrame = 0;
      const animate = () => {
        animationFrame = requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.04);
        if (!dragging) {
          if (!reducedMotion) earthRoot.rotation.y += delta * 0.105;
          earthRoot.rotation.y += velocityX;
          earthRoot.rotation.x = THREE.MathUtils.clamp(earthRoot.rotation.x + velocityY, -0.65, 0.65);
          velocityX *= 0.94;
          velocityY *= 0.94;
        }
        // Cloud systems drift independently over the rotating surface.
        // The faster relative spin makes their motion visible without looking mechanical.
        clouds.rotation.y += delta * 0.032;
        clouds.rotation.x = Math.sin(clock.elapsedTime * 0.11) * 0.009;
        stars.rotation.y += delta * 0.002;
        renderer.render(scene, camera);
      };
      animate();

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(animationFrame);
          clock.stop();
        } else {
          clock.start();
          animate();
        }
      });
    } catch (error) {
      console.error('3D Earth could not be initialized:', error);
      errorMessage.hidden = false;
    }
  </script>
</body>
</html>
